name: 03 - Deploy App-approved SHA to it-prod

"on":
  workflow_dispatch:
    inputs:
      release_id:
        description: App-approved release ID
        required: true
        type: string
      commit_sha:
        description: Exact approved commit SHA from the production branch
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: car-demo-prod-${{ inputs.release_id }}
  cancel-in-progress: false

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the exact approved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Databricks CLI
        uses: databricks/setup-cli@v1.8.0

      - name: Install CI dependencies
        run: pip install --disable-pip-version-check -r ci/requirements.txt

      - name: Read release and generated project ID
        id: release
        env:
          REGISTRY_DATABRICKS_HOST: ${{ vars.REGISTRY_DATABRICKS_HOST }}
          REGISTRY_DATABRICKS_TOKEN: ${{ secrets.REGISTRY_DATABRICKS_TOKEN }}
          REGISTRY_WAREHOUSE_ID: ${{ vars.REGISTRY_WAREHOUSE_ID }}
          REGISTRY_CATALOG: it_dev
          REGISTRY_SCHEMA: project_registry
        run: |
          python ci/registry_gate.py release-info \
            --release-id "${{ inputs.release_id }}" \
            --commit-sha "${{ inputs.commit_sha }}" \
            --repository "${{ github.repository }}" > release-info.json

          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          data = json.load(open("release-info.json", encoding="utf-8"))
          for key in ("project_id", "prod_target", "bundle_path", "prod_branch"):
              print(f"{key}={data[key]}")
          PY

      - name: Confirm commit still belongs to production branch
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          PROD_BRANCH: ${{ steps.release.outputs.prod_branch }}
        run: |
          git fetch origin "$PROD_BRANCH" --no-tags
          git merge-base --is-ancestor "$COMMIT_SHA" "origin/$PROD_BRANCH"

      - name: Resolve and enforce production Bundle tags
        env:
          DATABRICKS_HOST: ${{ vars.PROD_DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.PROD_DATABRICKS_TOKEN }}
          PROJECT_ID: ${{ steps.release.outputs.project_id }}
          TARGET: ${{ steps.release.outputs.prod_target }}
          BUNDLE_PATH: ${{ steps.release.outputs.bundle_path }}
        run: |
          cd "$BUNDLE_PATH"
          databricks bundle validate -t "$TARGET" \
            --var="project_id=$PROJECT_ID" \
            --output json > "$GITHUB_WORKSPACE/resolved-prod.json"

          python "$GITHUB_WORKSPACE/ci/check_bundle.py" \
            --resolved-json "$GITHUB_WORKSPACE/resolved-prod.json" \
            --project-id "$PROJECT_ID" \
            --environment prod \
            --catalog it_prod \
            --schema sample_project

      - name: Acquire App production authorization
        id: authorize
        env:
          REGISTRY_DATABRICKS_HOST: ${{ vars.REGISTRY_DATABRICKS_HOST }}
          REGISTRY_DATABRICKS_TOKEN: ${{ secrets.REGISTRY_DATABRICKS_TOKEN }}
          REGISTRY_WAREHOUSE_ID: ${{ vars.REGISTRY_WAREHOUSE_ID }}
          REGISTRY_CATALOG: it_dev
          REGISTRY_SCHEMA: project_registry
        run: |
          python ci/registry_gate.py authorize-prod \
            --release-id "${{ inputs.release_id }}" \
            --commit-sha "${{ inputs.commit_sha }}" \
            --repository "${{ github.repository }}"

      - name: Deploy and run same commit in it-prod
        id: deploy
        env:
          DATABRICKS_HOST: ${{ vars.PROD_DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.PROD_DATABRICKS_TOKEN }}
          PROJECT_ID: ${{ steps.release.outputs.project_id }}
          TARGET: ${{ steps.release.outputs.prod_target }}
          BUNDLE_PATH: ${{ steps.release.outputs.bundle_path }}
        run: |
          cd "$BUNDLE_PATH"
          databricks bundle deploy -t "$TARGET" --var="project_id=$PROJECT_ID"
          databricks bundle run -t "$TARGET" car_data_refresh --var="project_id=$PROJECT_ID"
          databricks bundle summary -t "$TARGET" \
            --var="project_id=$PROJECT_ID" \
            --output json > "$GITHUB_WORKSPACE/summary-prod.json"

      - name: Apply and read back production tags
        id: tags
        env:
          DATABRICKS_HOST: ${{ vars.PROD_DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.PROD_DATABRICKS_TOKEN }}
          PROJECT_ID: ${{ steps.release.outputs.project_id }}
        run: |
          python ci/tag_assets.py \
            --summary-json summary-prod.json \
            --project-id "$PROJECT_ID" \
            --environment prod \
            --catalog it_prod \
            --schema sample_project \
            --table car_makes \
            --table car_models \
            --output tag-results-prod.json

      - name: Record successful production deployment
        if: success()
        env:
          REGISTRY_DATABRICKS_HOST: ${{ vars.REGISTRY_DATABRICKS_HOST }}
          REGISTRY_DATABRICKS_TOKEN: ${{ secrets.REGISTRY_DATABRICKS_TOKEN }}
          REGISTRY_WAREHOUSE_ID: ${{ vars.REGISTRY_WAREHOUSE_ID }}
          REGISTRY_CATALOG: it_dev
          REGISTRY_SCHEMA: project_registry
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python ci/registry_gate.py complete-prod \
            --release-id "${{ inputs.release_id }}" \
            --commit-sha "${{ inputs.commit_sha }}" \
            --repository "${{ github.repository }}" \
            --status DEPLOYED \
            --tag-results tag-results-prod.json \
            --run-url "$RUN_URL" \
            --message "The approved commit was deployed to it-prod and all required tags were verified."

      - name: Record failed production deployment
        if: failure() && steps.authorize.outcome == 'success'
        env:
          REGISTRY_DATABRICKS_HOST: ${{ vars.REGISTRY_DATABRICKS_HOST }}
          REGISTRY_DATABRICKS_TOKEN: ${{ secrets.REGISTRY_DATABRICKS_TOKEN }}
          REGISTRY_WAREHOUSE_ID: ${{ vars.REGISTRY_WAREHOUSE_ID }}
          REGISTRY_CATALOG: it_dev
          REGISTRY_SCHEMA: project_registry
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          EXTRA=""
          if [ -f tag-results-prod.json ]; then
            EXTRA="--tag-results tag-results-prod.json"
          fi
          python ci/registry_gate.py complete-prod \
            --release-id "${{ inputs.release_id }}" \
            --commit-sha "${{ inputs.commit_sha }}" \
            --repository "${{ github.repository }}" \
            --status FAILED \
            --run-url "$RUN_URL" \
            --message "The production deployment or tag verification failed." \
            $EXTRA
