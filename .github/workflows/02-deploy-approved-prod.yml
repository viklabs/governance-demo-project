name: 02 - Deploy App-approved release to it-prod

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: App-approved release ID
        required: true
        type: string
      source_revision:
        description: Exact full Git commit SHA stored on the approved release
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    # Protect this GitHub Environment and keep the production credential in it.
    environment: production
    runs-on: ubuntu-latest
    concurrency:
      group: governance-prod-${{ vars.GOVERNANCE_PROJECT_ID }}
      cancel-in-progress: false
    env:
      GOVERNANCE_APP_URL: ${{ vars.GOVERNANCE_APP_URL }}
      GOVERNANCE_CI_PACKAGE: ${{ vars.GOVERNANCE_CI_PACKAGE }}

      REGISTRY_DATABRICKS_HOST: ${{ vars.REGISTRY_DATABRICKS_HOST }}
      REGISTRY_DATABRICKS_AUTH_TYPE: oauth-m2m
      REGISTRY_DATABRICKS_CLIENT_ID: ${{ vars.PROD_DEPLOYER_CLIENT_ID }}
      REGISTRY_DATABRICKS_CLIENT_SECRET: ${{ secrets.PROD_DEPLOYER_CLIENT_SECRET }}

      PROD_DATABRICKS_HOST: ${{ vars.PROD_DATABRICKS_HOST }}
      PROD_DATABRICKS_AUTH_TYPE: oauth-m2m
      PROD_DATABRICKS_CLIENT_ID: ${{ vars.PROD_DEPLOYER_CLIENT_ID }}
      PROD_DATABRICKS_CLIENT_SECRET: ${{ secrets.PROD_DEPLOYER_CLIENT_SECRET }}

    steps:
      - name: Check out exact approved revision
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_revision }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Databricks CLI
        uses: databricks/setup-cli@v1.9.0

      - name: Install centrally maintained governance client
        run: python -m pip install "$GOVERNANCE_CI_PACKAGE"

      - name: Acquire App authorization and deploy exact revision to it-prod
        run: >-
          governance-ci deploy-prod
          --app-url "$GOVERNANCE_APP_URL"
          --release-id "${{ inputs.release_id }}"
          --source-revision "${{ inputs.source_revision }}"
          --source-dir .
          --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          --result-file governance-prod-result.json

      - name: Upload production result evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: governance-prod-result-${{ inputs.release_id }}
          path: governance-prod-result.json
          if-no-files-found: ignore
