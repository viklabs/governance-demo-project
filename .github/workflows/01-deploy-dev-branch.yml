name: 01 - Deploy dev branch to it-dev

"on":
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: car-demo-dev-${{ github.repository }}
  cancel-in-progress: true

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the dev branch commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Databricks CLI
        uses: databricks/setup-cli@v1.8.0

      - name: Install CI dependencies
        run: pip install --disable-pip-version-check -r ci/requirements.txt

      - name: Read active project and generated project ID
        id: project
        env:
          REGISTRY_DATABRICKS_HOST: ${{ vars.REGISTRY_DATABRICKS_HOST }}
          REGISTRY_DATABRICKS_TOKEN: ${{ secrets.REGISTRY_DATABRICKS_TOKEN }}
          REGISTRY_WAREHOUSE_ID: ${{ vars.REGISTRY_WAREHOUSE_ID }}
          REGISTRY_CATALOG: it_dev
          REGISTRY_SCHEMA: project_registry
        run: |
          python ci/registry_gate.py project-info \
            --repository "${{ github.repository }}" \
            --branch "${GITHUB_REF_NAME}" \
            --environment dev > project-info.json

          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          data = json.load(open("project-info.json", encoding="utf-8"))
          for key in ("project_id", "dev_target", "bundle_path"):
              print(f"{key}={data[key]}")
          PY

      - name: Resolve and enforce the dev Bundle
        env:
          DATABRICKS_HOST: ${{ vars.DEV_DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DEV_DATABRICKS_TOKEN }}
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
          TARGET: ${{ steps.project.outputs.dev_target }}
          BUNDLE_PATH: ${{ steps.project.outputs.bundle_path }}
        run: |
          cd "$BUNDLE_PATH"
          databricks bundle validate -t "$TARGET" \
            --var="project_id=$PROJECT_ID" \
            --output json > "$GITHUB_WORKSPACE/resolved-dev.json"

          python "$GITHUB_WORKSPACE/ci/check_bundle.py" \
            --resolved-json "$GITHUB_WORKSPACE/resolved-dev.json" \
            --project-id "$PROJECT_ID" \
            --environment dev \
            --catalog it_dev \
            --schema sample_project

      - name: Deploy and run the dev branch in it-dev
        env:
          DATABRICKS_HOST: ${{ vars.DEV_DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DEV_DATABRICKS_TOKEN }}
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
          TARGET: ${{ steps.project.outputs.dev_target }}
          BUNDLE_PATH: ${{ steps.project.outputs.bundle_path }}
        run: |
          cd "$BUNDLE_PATH"
          databricks bundle deploy -t "$TARGET" --var="project_id=$PROJECT_ID"
          databricks bundle run -t "$TARGET" car_data_refresh --var="project_id=$PROJECT_ID"
          databricks bundle summary -t "$TARGET" \
            --var="project_id=$PROJECT_ID" \
            --output json > "$GITHUB_WORKSPACE/summary-dev.json"

      - name: Apply and read back dev tags
        env:
          DATABRICKS_HOST: ${{ vars.DEV_DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DEV_DATABRICKS_TOKEN }}
          PROJECT_ID: ${{ steps.project.outputs.project_id }}
        run: |
          python ci/tag_assets.py \
            --summary-json summary-dev.json \
            --project-id "$PROJECT_ID" \
            --environment dev \
            --catalog it_dev \
            --schema sample_project \
            --table car_makes \
            --table car_models \
            --output tag-results-dev.json
