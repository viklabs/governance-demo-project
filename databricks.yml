bundle:
  name: governance-demo-project
  databricks_cli_version: ">= 0.250.0"

include:
  - resources/*.yml

variables:
  project_id:
    description: Project ID generated and supplied by Project Registry & Governance.
  catalog_name:
    description: Target Unity Catalog catalog supplied by the registered environment.
  schema_name:
    description: Project-owned schema supplied by the registry.
  environment_name:
    description: Mandatory governance environment tag value.

sync:
  include:
    - src/**

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-8589af37-05e5.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog_name: it_dev
      schema_name: sample_project_v3
      environment_name: dev

  prod:
    mode: production
    workspace:
      host: https://dbc-ee468813-8a08.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog_name: it_prod
      schema_name: sample_project_v3
      environment_name: prod
