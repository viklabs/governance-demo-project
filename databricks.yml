bundle:
  name: governance-demo-project
  databricks_cli_version: ">= 0.250.0"

include:
  - resources/*.yml

variables:
  project_id:
    description: Project ID generated by the Project Registry App.
  catalog_name:
    description: Target Unity Catalog catalog.
  schema_name:
    description: Project schema.
    default: sample_project
  environment_name:
    description: Governance environment tag value.

sync:
  include:
    - src/**

# Replace both workspace hosts before running either workflow.
targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-8589af37-05e5.cloud.databricks.com
    variables:
      catalog_name: it_dev
      schema_name: sample_project
      environment_name: dev

prod:
  mode: production

  workspace:
    host: https://dbc-ee468813-8a08.cloud.databricks.com

    # Stable production deployment location.
    root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  # Demo configuration: use the owner of PROD_DATABRICKS_TOKEN
  # as the job runtime identity.
  run_as:
    user_name: ${workspace.current_user.userName}

  permissions:
    - user_name: ${workspace.current_user.userName}
      level: CAN_MANAGE

  variables:
    catalog_name: it_prod
    schema_name: sample_project
    environment_name: prod

